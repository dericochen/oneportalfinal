name: Pengecekan SLA tiap jam

# Memanggil /api/cron/tick setiap jam: menandai laporan yang melewati tenggat
# (eskalasi ke supervisor) sekaligus menjaga proyek Supabase Free tetap aktif.
# Secrets repo yang dibutuhkan: SITE_URL (mis. https://oneportal.vercel.app) dan CRON_SECRET.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil endpoint tick
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets SITE_URL dan CRON_SECRET belum diatur."; exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/tick"
